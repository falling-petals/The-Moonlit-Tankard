<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月下酒馆 · 角色动作室</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#211f24;color:#f8eedf;font:13px/1.6 system-ui,"Microsoft YaHei",sans-serif}header,main,footer{max-width:1260px;margin:auto;padding:28px}header{padding-bottom:18px}a{color:#dfb873;text-decoration:none}h1{font-size:28px;font-weight:600;letter-spacing:2px;margin:10px 0}header p,footer{color:#bcb2ac}nav{display:flex;gap:20px}.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:20px;padding:14px 18px;background:#302c30;border:1px solid #51464a;border-radius:12px;position:sticky;top:10px;z-index:2}.toolbar select,.toolbar button{font:inherit;padding:7px 12px;background:#f4eadb;color:#42353f;border:0;border-radius:6px;cursor:pointer}.toolbar label{display:flex;gap:10px;align-items:center}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;padding-top:8px}.character{min-width:0;background:#f3e9d9;color:#493b44;border:1px solid #cdbba8;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px #0002}.stage{height:195px;display:grid;place-items:center;background:radial-gradient(ellipse at center,#514456,#302c36);position:relative}.stage:after{content:"";position:absolute;width:70px;height:9px;bottom:20px;border-radius:50%;background:#0002;pointer-events:none}.stage canvas{width:230px;max-width:100%;height:180px;image-rendering:pixelated;position:relative;z-index:1}.info{padding:14px}.info header{padding:0;display:flex;justify-content:space-between;align-items:center}.info h2{font-size:16px;margin:0}.tag{font-size:10px;color:#8d726d}.expressions{display:flex;gap:5px;flex-wrap:wrap;margin:11px 0}.expressions button{font:inherit;font-size:11px;border:1px solid #d9c7b5;border-radius:5px;padding:3px 6px;background:#fcf5e9;color:#65505a;cursor:pointer}.expressions button.active{background:#685062;color:#fff4e3;border-color:#685062}.info a{font-size:11px;color:#976428}.status{font-size:11px;color:#9b8690;margin-left:auto}footer{padding-top:6px}@media(max-width:1000px){main{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:740px){main{grid-template-columns:repeat(2,minmax(0,1fr))}header,main,footer{padding:18px}.toolbar{position:static}}@media(max-width:430px){main{grid-template-columns:1fr}}
</style></head>
<body><header><nav><a href="../index.html">← 返回酒馆</a><a href="index.html">全部美术素材</a></nav><h1>角色动作室</h1><p>熟悉的面孔，多一点小情绪。四向走动、站立与表情都可以在这里逐一查看。</p><div class="toolbar"><label>预览 <select id="pose"><option value="cycle">四向轮播</option><option value="down">正面行走</option><option value="up">背面行走</option><option value="left">向左行走</option><option value="right">向右行走</option><option value="neutral">站立</option><option value="happy">高兴</option><option value="sad">难过</option><option value="angry">生气</option><option value="surprised">惊讶</option><option value="thinking">思考</option><option value="working">工作</option><option value="tired">疲倦</option><option value="blink">眨眼</option></select></label><button id="play" type="button">暂停预览</button><span id="status" class="status">正在准备角色…</span></div></header><main id="characters"></main><footer>13 位角色 · 每位 20 帧 · 透明 PNG 原图完整保留。点击角色下方的表情可单独预览，切换顶部选项恢复统一预览。</footer><script type="module" src="character-preview.js"></script></body></html>
