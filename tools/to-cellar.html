<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>自动经营到地窖 · 月下酒馆</title>
<style>
:root{--paper:#f3e9d6;--ink:#33291d;--soft:#7d6a52;--line:#d8c8ac;--wine:#7d3030}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;
  background:#14100c radial-gradient(80% 60% at 50% 0%,#2a2016,#100c09 70%);
  font-family:"Kaiti SC","KaiTi","楷体","STKaiti","SimSun","宋体",serif;color:var(--ink)}
.card{width:min(600px,100%);background:var(--paper);padding:34px 38px 30px;
  box-shadow:0 24px 70px #0009;
  clip-path:polygon(0 12px,12px 12px,12px 0,calc(100% - 12px) 0,calc(100% - 12px) 12px,100% 12px,
    100% calc(100% - 12px),calc(100% - 12px) calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,12px calc(100% - 12px),0 calc(100% - 12px))}
h1{margin:0 0 6px;font-size:24px;letter-spacing:.12em;font-weight:600}
.sub{margin:0 0 20px;font-size:13px;color:var(--soft);letter-spacing:.06em;line-height:1.7}
.slate{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;padding:12px 14px;margin:0 0 20px;
  background:#e8dcc6;border:1px solid var(--line);font-size:13px;color:var(--soft)}
.slate b{color:var(--ink);font-weight:600}
.opt{display:block;width:100%;text-align:left;padding:13px 16px;margin:0 0 10px;cursor:pointer;
  background:#fbf5e8;border:1px solid var(--line);font:inherit;color:var(--ink);
  transition:background .16s,border-color .16s,transform .16s}
.opt:hover:enabled{background:#fff;border-color:#b9a487;transform:translateY(-1px)}
.opt:disabled{opacity:.45;cursor:default}
.opt strong{display:block;font-size:15px;letter-spacing:.05em;margin-bottom:3px}
.opt span{display:block;font-size:12px;color:var(--soft);line-height:1.6}
.ghost{background:none;border:0;color:var(--soft);font:inherit;font-size:13px;cursor:pointer;padding:6px 0;letter-spacing:.08em}
.ghost:hover{color:var(--ink)}
.log{margin:14px 0 0;padding:12px 14px;background:#2a2016;color:#d8c8ac;font:12px/1.8 ui-monospace,Menlo,Consolas,monospace;
  max-height:220px;overflow:auto;display:none;white-space:pre-wrap}
.log.on{display:block}
.log b{color:#e5c98a;font-weight:600}
.done{font-size:13px;color:var(--wine);margin:12px 0 0;min-height:1em;line-height:1.7}
</style>
</head>
<body>
<div class="card">
  <h1>让店里自己忙两晚</h1>
  <p class="sub">这一步会从你现在的存档接着往下跑：扩桌、雇人、升级、补货，两个晚上把口碑推过 4.5，第三颗星在打烊时点亮。不写死数据，走的是游戏本身的引擎。</p>
  <div class="slate" id="slate">
    <div>存档：<b id="s-day">—</b></div>
    <div>口碑：<b id="s-rep">—</b></div>
    <div>星星：<b id="s-stars">—</b></div>
    <div>地窖：<b id="s-cellar">—</b></div>
  </div>

  <button class="opt" id="run">
    <strong>自动经营，跑到地窖开门</strong>
    <span>原存档会先备份一份。跑完停在当晚的打烊结算页，你能亲眼看到第三颗星亮起来。</span>
  </button>
  <button class="opt" id="back">
    <strong>先不动，回店里</strong>
    <span>直接进游戏，保持现状。</span>
  </button>
  <div class="log" id="log"></div>
  <p class="done" id="done"></p>
</div>

<script type="module">
import {createGame,advance,act} from '../src/engine.js';
import {parseGame,publicSave,SAVE_KEY} from '../src/storage.js';
import {DRINKS,STAFF,UPGRADES,TABLE_COSTS} from '../src/content.js';

const $=id=>document.getElementById(id);
const read=k=>{try{return localStorage.getItem(k);}catch{return null;}};
const write=(k,v)=>{try{localStorage.setItem(k,v);}catch{}};
const raw=read(SAVE_KEY);

let state=null,broken='';
if(raw){
  try{state=parseGame(raw);}catch(e){broken=e.message;}
}
if(!state)state=createGame();

const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
$('s-day').textContent=`第 ${state.day} 天`;
$('s-rep').textContent=state.reputation.toFixed(2);
$('s-stars').textContent=stars(state.stars);
$('s-cellar').textContent=state.milestones.includes('cellar')?'已开门':`第 ${state.stars} 星 · 还差 ${stars(3)}`;
if(broken)$('done').textContent='旧存档读不进来（'+broken+'），会从一间新店开始跑。';
if(state.milestones.includes('cellar')){
  $('run').disabled=true;
  $('done').textContent='这间店的地窖已经开了 —— 回店里，底栏就有「地窖」。';
}

// 一个不算聪明但足够勤快的替身：有单就接，有脏桌就收，做好了就端。
function autoPlay(s,seconds){
  let left=seconds;
  while(left>0&&s.phase==='open'){
    advance(s,0.5);left-=0.5;
    const p=s.player;
    if(p.job&&p.job.stage==='carry'){act(s,{type:'player-deliver',table:p.job.table});continue;}
    if(p.job)continue;
    const req=s.tables.find(t=>t.status==='waiting'&&!t.worker&&t.request&&!t.request.fulfilled&&s.stock[t.order.drink]>=t.order.quantity);
    if(req){act(s,{type:'fulfill-request',table:req.id});continue;}
    const t=s.tables.find(t=>t.enabled!==false&&t.status==='waiting'&&!t.worker&&s.stock[t.order.drink]>=t.order.quantity&&(!t.request||t.request.fulfilled));
    if(t){act(s,{type:'player-work',table:t.id});continue;}
    const d=s.tables.find(t=>t.status==='dirty'&&!t.worker);
    if(d)act(s,{type:'player-clean',table:d.id});
  }
}
function manage(s){
  const open=s.tables.filter(t=>t.enabled!==false).length,idx=s.tables.findIndex(t=>t.enabled===false);
  if(idx>0&&open<4&&s.gold>=TABLE_COSTS[idx])act(s,{type:'expand-table'});
  if(s.gold>=260&&s.staff.length<2){
    const next=STAFF.find(d=>!s.staff.some(w=>w.id===d.id)&&s.gold>=d.hireCost);
    if(next)act(s,{type:'hire',id:next.id});
  }
  for(const id of ['cellar','bar','ambience','plants'])
    if(!s.upgrades[id]&&s.gold>=UPGRADES[id].cost+120)act(s,{type:'upgrade',id});
  for(let i=0;i<8;i++){
    const low=Object.keys(DRINKS).filter(k=>s.menu[k]).sort((a,b)=>s.stock[a]-s.stock[b])[0];
    if(!low||s.stock[low]>=16)break;
    if(!act(s,{type:'restock',drink:low}).ok)break;
  }
}

const log=$('log');
const lines=[];
function line(html){log.classList.add('on');log.insertAdjacentHTML('beforeend',html+'\n');log.scrollTop=log.scrollHeight;lines.push(html.replace(/<[^>]+>/g,''));}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

$('run').addEventListener('click',async()=>{
  $('run').disabled=true;$('back').disabled=true;$('done').textContent='';
  if(raw)write(SAVE_KEY+'-backup',raw);
  const s=state;
  try{
    if(s.phase==='open')act(s,{type:'close'});
    if(s.phase==='closed')act(s,{type:'next-day'});
    for(let night=1;night<=8;night++){
      manage(s);
      act(s,{type:'open'});
      autoPlay(s,700);
      const tables=s.tables.filter(t=>t.enabled!==false).length;
      line(`<b>第 ${s.day} 晚</b>　桌 ${tables} · 伙伴 ${s.staff.length}　服务 ${s.stats.served} 桌 / 走 ${s.stats.missed} 人　口碑 ${s.reputation.toFixed(3)}　${stars(s.stars)}${s.starNote==='blocked'?'（有人等太久，这晚没点亮）':''}`);
      if(s.stars>=3&&s.milestones.includes('cellar'))break;
      act(s,{type:'next-day'});
      await wait(60);
    }
    // 停在打烊那一刻，让结算页自己去说「今夜点亮了一颗星」。
    if(s.phase!=='closed'){act(s,{type:'open'});act(s,{type:'close'});}
    write(SAVE_KEY,publicSave(s));
    line(`<b>存档已写入</b>　第 ${s.day} 天 · ${stars(s.stars)} · 金币 ${s.gold}`);
    $('done').textContent=s.milestones.includes('cellar')
      ? '第三颗星亮了。正在回店 —— 打烊结算页上会写着一颗星，点「迎接新的一天」，后门的钥匙就交到你手上。'
      : '八晚过去还是没凑够，回店里自己再看一眼？';
    try{sessionStorage.setItem('moonlit-run-log',lines.join('\n')+'\n'+$('done').textContent);}catch{}
    await wait(1400);
    location.replace('/');
  }catch(e){
    $('done').textContent='跑到一半出错了：'+e.message;
    $('run').disabled=false;$('back').disabled=false;
  }
});

$('back').addEventListener('click',()=>location.replace('/'));
</script>
</body>
</html>
